name: Generate Activity Graph & Profile Stats

on:
  schedule:
    - cron: "0 * * * *" # Runs automatically every hour
  workflow_dispatch: # Allows manual one-click refresh

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Generate Activity Area Graph SVG
      - name: Generate Activity Graph SVG
        uses: Ashutosh00710/github-readme-activity-graph@master
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: kem85
          THEME: tokyo-night
          AREA: true
          HIDE_BORDER: true
          BG_COLOR: "0d1117"
          COLOR: "a855f7"
          LINE: "a855f7"
          POINT: "c084fc"
          OUTPUT_PATH: "profile-activity-graph.svg"

      # 2. Generate Stats & Summary Cards
      - name: Generate Profile Summary Cards
        uses: vncloudtech/github-profile-summary-cards@release
        with:
          USERNAME: kem85
          BRANCH_NAME: main
          UTC_OFFSET: 3
          THEME: tokyonight

      # 3. Commit and Push all generated SVGs
      - name: Commit and Push All SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-activity-graph.svg profile-summary-card-output/ || true
          git commit -m "chore: update profile stats and activity graph [skip ci]" || exit 0
          git push

name: Generate Profile Stats & Graph

on:
  schedule:
    - cron: "0 * * * *" # Runs hourly
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Generate Summary Cards (Profile Details & Stats)
      - name: Generate Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: kem85
          BRANCH_NAME: main
          UTC_OFFSET: 3
          THEME: tokyonight

      # 2. Generate the Contribution Area Graph SVG
      - name: Generate Contribution Graph SVG
        run: |
          python -c "
          import urllib.request, json, datetime

          url = 'https://github-contributions-api.jogruber.de/v4/kem85?y=last'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as r:
              data = json.loads(r.read())

          contributions = data.get('contributions', [])
          total = sum(c['count'] for c in contributions)

          weeks = []
          for i in range(0, len(contributions), 7):
              chunk = contributions[i:i+7]
              weeks.append({'date': chunk[0]['date'], 'count': sum(c['count'] for c in chunk)})

          W, H = 850, 260
          pad_l, pad_r, pad_t, pad_b = 45, 30, 65, 35
          plot_w, plot_h = W - pad_l - pad_r, H - pad_t - pad_b
          max_val = max([w['count'] for w in weeks] or [10])
          max_val = max(max_val, 5)

          n = len(weeks)
          pts = [(pad_l + (i / (n - 1)) * plot_w, pad_t + plot_h - (w['count'] / max_val) * plot_h) for i, w in enumerate(weeks)]

          def get_path(p):
              if not p: return ''
              d = [f'M {p[0][0]:.1f} {p[0][1]:.1f}']
              for i in range(len(p) - 1):
                  cx = (p[i][0] + p[i+1][0]) / 2
                  d.append(f'C {cx:.1f} {p[i][1]:.1f}, {cx:.1f} {p[i+1][1]:.1f}, {p[i+1][0]:.1f} {p[i+1][1]:.1f}')
              return ' '.join(d)

          curve_path = get_path(pts)
          area_path = f'{curve_path} L {pts[-1][0]:.1f} {pad_t + plot_h:.1f} L {pts[0][0]:.1f} {pad_t + plot_h:.1f} Z'

          months, last_m = [], None
          for i, w in enumerate(weeks):
              dt = datetime.datetime.strptime(w['date'], '%Y-%m-%d')
              m_name = dt.strftime('%b')
              if m_name != last_m:
                  last_m = m_name
                  months.append((pad_l + (i / (n - 1)) * plot_w, m_name))

          month_svg = '\n'.join([f'<text x=\"{x:.1f}\" y=\"{H - 12}\" fill=\"#64748b\" font-size=\"11\" font-family=\"Segoe UI, sans-serif\" text-anchor=\"middle\">{m}</text>' for x, m in months])

          grid_svg = []
          for v in [0, max_val // 2, max_val]:
              y = pad_t + plot_h - (v / max_val) * plot_h
              grid_svg.append(f'<line x1=\"{pad_l}\" y1=\"{y:.1f}\" x2=\"{W - pad_r}\" y2=\"{y:.1f}\" stroke=\"#1e293b\" stroke-dasharray=\"3,3\" stroke-width=\"1\"/>')
              grid_svg.append(f'<text x=\"{pad_l - 10}\" y=\"{y + 4:.1f}\" fill=\"#64748b\" font-size=\"10\" font-family=\"Segoe UI, sans-serif\" text-anchor=\"end\">{v}</text>')

          grid_str = '\n'.join(grid_svg)

          svg = f'''<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"{W}\" height=\"{H}\" viewBox=\"0 0 {W} {H}\" fill=\"none\">
            <defs>
              <linearGradient id=\"purpleGrad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">
                <stop offset=\"0%\" stop-color=\"#a855f7\" stop-opacity=\"0.45\" />
                <stop offset=\"100%\" stop-color=\"#a855f7\" stop-opacity=\"0.0\" />
              </linearGradient>
            </defs>
            <rect width=\"{W}\" height=\"{H}\" rx=\"12\" fill=\"#0d1117\" stroke=\"#30363d\" stroke-width=\"1\" />
            <text x=\"25\" y=\"35\" fill=\"#a855f7\" font-size=\"16\" font-weight=\"bold\" font-family=\"Segoe UI, -apple-system, sans-serif\">Karim&apos;s Contribution Graph</text>
            <text x=\"{W - 25}\" y=\"35\" fill=\"#94a3b8\" font-size=\"13\" font-family=\"Segoe UI, -apple-system, sans-serif\" text-anchor=\"end\">{total} contributions in the last year</text>
            {grid_str}
            <path d=\"{area_path}\" fill=\"url(#purpleGrad)\" />
            <path d=\"{curve_path}\" fill=\"none\" stroke=\"#a855f7\" stroke-width=\"2.5\" stroke-linecap=\"round\" />
            {month_svg}
          </svg>'''

          with open('profile-activity-graph.svg', 'w', encoding='utf-8') as f:
              f.write(svg)
          "

      # 3. Commit and push the generated graph and summary cards
      - name: Commit and Push SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-activity-graph.svg profile-summary-card-output/ || true
          git commit -m "chore: update stats and activity graph [skip ci]" || exit 0
          git push
